<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BlogWorld</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="header">
            <div class="container container__header"></div>
        </header>
        <main class="main">
            <div class="container container__main">
                <div class="section section__hero"></div>
                <div class="section section__about-as"></div>
                <div class="section section__posts"></div>
                <div class="section section__portfolio">
                    <div id="portfolio-js"></div>
                </div>
                <div class="section section__testimonials">
                    <div id="testimonials-js" class="testimonials"></div>
                    <button class="testimonials__btn testimonials__next-btn">
                        next
                    </button>
                    <button class="testimonials__btn testimonials__prev-btn">
                        prev
                    </button>
                </div>
                <div class="section section__contact-us"></div>
            </div>
        </main>
        <footer class="footer">
            <div class="container container__footer">
                <div>
                    <div>
                        <div class="wraper__footer">
                            <form action="submit"></form>
                            <div id="map-container">
                                <img
                                    class="footer__map--placeholder"
                                    src="../blogWord/img/map_placeholder/img_map.jpg"
                                    alt="Map placeholder"
                                    id="map-placeholder"
                                />
                                <div class="footer__map" id="map"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
        <script src="./js/mapLoader.js"></script>
        <script type="module" src="./js/index.js"></script>
    </body>
</html>
